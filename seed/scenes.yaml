async def seed_scenes(session: AsyncSession) -> None:
    for data in INITIAL_SCENES:
        result = await session.execute(
            select(Scene).where(Scene.slug == data["slug"])
        )
        existing = result.scalar_one_or_none()
        if not existing:
            scene = Scene(**data)
            session.add(scene)
        else:
            # Обновляем существующие записи (например промпт отеля)
            existing.prompt = data["prompt"]
            existing.name_ru = data["name_ru"]
            existing.is_active = data["is_active"]
            existing.sort_order = data["sort_order"]
    await session.commit()
    logger.info("Scenes seeded/updated successfully.")