<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Кабинет</title>
<link rel="stylesheet" href="/app/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="splash" class="splash">
  <div class="spinner" aria-hidden="true"></div>
</div>

<div id="gate" class="splash hidden">
  <div class="gate-box">
    <div class="gate-emoji" id="gate-emoji">👋</div>
    <p id="gate-text">Что-то пошло не так.</p>
    <button class="btn btn-primary" id="gate-btn">Понятно</button>
  </div>
</div>

<main id="app" class="hidden">
  <section id="tab-profile" class="tab"></section>
  <section id="tab-shop" class="tab hidden"></section>
  <section id="tab-metrics" class="tab hidden"></section>
</main>

<nav id="tabbar" class="hidden">
  <button class="tabbtn is-active" data-tab="profile"><span>👤</span>Профиль</button>
  <button class="tabbtn" data-tab="shop"><span>🛒</span>Магазин</button>
  <button class="tabbtn hidden" data-tab="metrics" id="tabbtn-metrics"><span>📊</span>Метрики</button>
</nav>

<div id="toast" class="toast hidden"></div>

<script src="/app/static/app.js"></script>
</body>
</html>
